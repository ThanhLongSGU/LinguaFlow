spring.application.name=linguaflow
server.port=8080

# Chaui ket noi MS SQL Server (SQLEXPRESS)
spring.datasource.url=jdbc:sqlserver://localhost:1433;instanceName=SQLEXPRESS;databaseName=LinguaFlowDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Log Debug
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.microsoft.sqlserver.jdbc=DEBUG