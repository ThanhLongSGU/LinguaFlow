spring.application.name=linguaflow-v2
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=LinguaFlowV2;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:linguaflow_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=15000
spring.jackson.time-zone=UTC
server.error.include-message=always
# Do not allow request origins from untrusted sites: Vite proxy provides same-origin API in dev.
