name: LinguaFlow Continuous Integration (CI)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Grant execute permission for mvnw
        run: chmod +x backend/mvnw

      - name: Build & Run Tests
        run: |
          cd backend
          ./mvnw clean test

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Thêm bước cài đặt pnpm chuẩn
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install Dependencies
        run: |
          cd frontend
          pnpm install

      - name: Build React Project
        run: |
          cd frontend
          pnpm build
